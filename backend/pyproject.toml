[project]
name = "career-quest-backend"
version = "0.1.0"
description = "Career Quest — AI navigator for employee development (HackAlem AI, Halyk Bank track, case 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.60",
    "openai-agents>=0.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-ignore = ["B008"]  # FastAPI idiom: Depends()/File() in argument defaults
